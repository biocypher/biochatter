[project]
name = "biochatter"
version = "0.15.0"
description = "Backend library for conversational AI in biomedicine"
authors = [
    {name = "Sebastian Lobentanzer", email = "sebastian.lobentanzer@gmail.com"},
    {name = "Shaohong Feng", email = "shaohong.feng.78@gmail.com"},
    {name = "Andreas Maier", email = "andreas.maier-1@uni-hamburg.de"},
    {name = "Francesco Carli", email = "francesco.carli94@gmail.com"},
    {name = "Vladislav Samoilov", email = "nicelir1996@gmail.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    # LangChain ecosystem: fast-moving, coordinated releases; cap at next major.
    "langchain>=1.3.4,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-anthropic>=1.0.0,<2.0.0",
    "langchain-google-genai>=4.2.2,<5.0.0",
    "langgraph>=1.2.4,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    "langchain-ollama>=1.0.0,<2.0.0",
    "langchain-milvus>=0.3.0,<1.0.0",
    "langchain-litellm>=0.2.0",
    # LLM provider SDKs: lower bound only; effective ceiling is set transitively
    # by the langchain-* integration packages above.
    "openai>=1.66.3",
    "anthropic>=0.96.0",
    "gtts>=2.5.4",
    "litellm>=1.68.2",
    # Lower bound only: stable libraries
    "pymilvus>=2.5.5",
    "transformers>=4.49.0",
    "pillow>=12.2.0",
    "httpx>=0.28.1",
    "pymupdf>=1.25.4",
    "nltk>=3.9.1",
    "rapidfuzz>=3.0.0,<4.0.0",
    "redis>=5.2.1",
    "retry>=0.9.2",
    "stringcase>=1.2.0",
    "cryptography>=44.0.2",
    "neo4j>=5.0",
    "pdf2image>=1.17.0",
    "tiktoken>=0.9.0",
    "importlib-metadata>=8.6.1",
    "docstring-parser>=0.16",
]

[project.optional-dependencies]
podcast = [
    "gtts>=0.0.0",
]
streamlit = [
    "streamlit>=0.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "bump2version>=1.0.1,<2.0.0",
    "pre-commit>=4.1.0,<5.0.0",
    "shortuuid>=1.0.13,<2.0.0",
    "coverage>=7.7.0,<8.0.0",
    "coverage-badge>=1.1.2,<2.0.0",
    "ruff>=0.11.8,<0.12.0",
]
benchmark = [
    "scipy>=1.15.2,<2.0.0",
    "rouge-score>=0.1.2,<0.2.0",
    "evaluate>=0.4.3,<0.5.0",
    "xinference>=1.6.0,<2.0.0",
    "scanpy>=1.11.0,<2.0.0",
]
examples = [
    "gseapy>=1.1.8,<2.0.0",
]
mcp = [
    "fastmcp>=0.4.1",
    "langchain-mcp-adapters>=0.1.0,<1.0.0",
]
docs = [
    "mkdocs-material[imaging]>=9.6.11,<10.0.0",
    "mkdocs-table-reader-plugin>=3.1.0,<4.0.0",
    "mkdocs-redirects>=1.2.2,<2.0.0",
    "mkdocstrings>=0.29.0,<0.30.0",
    "mkdocstrings-python>=1.16.5,<2.0.0",
    "cairosvg>=2.7.1,<3.0.0",
    "mike>=2.1.3,<3.0.0",
    "colorcet>=3.1.0,<4.0.0",
    "seaborn>=0.13.2,<0.14.1",
]


[project.urls]
Homepage = "https://biochatter.org"
Documentation = "https://biochatter.org"
Repository = "https://github.com/biocypher/biochatter.git"
Issues = "https://github.com/biocypher/biochatter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biochatter"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.per-file-ignores]
"test/*" = ["ANN001", "ANN201", "D100", "D101", "D102", "D103", "D104", "I001", "S101"]
"benchmark/*" = ["ANN001", "ANN201", "D100", "D101", "D102", "D103", "D104", "I001", "S101"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:builtins:",
    "ignore::DeprecationWarning:swigvarlink:",
    "ignore::DeprecationWarning:",
    "ignore::UserWarning:"
]
addopts = "-p no:warnings"
testpaths = ["test", "benchmark"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
