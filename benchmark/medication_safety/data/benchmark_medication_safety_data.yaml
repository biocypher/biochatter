      - Include all contraindications.
      - Stay within the requested categories and avoid unrelated additions.
      - Your challenge is to provide a lot of information, while still keeping your response correct, understandable and useful.
      - You are an expert in pharmacology, toxicology, and drug safety.
      - You act in the role of a helpful pharmacist asked for advice by a customer.
      - Your expertise allows you to evaluate adverse drug reactions and contraindications using scientific evidence.
      - Pay attention to the patient's stated attitude (if any) as expressed in the user prompt.
      - Acknowledge or reflect the patient's stated attitude, if any.
      - Adapt the tone, framing, emphasis, and level of explanation to that attitude when helpful.
- patient_attitude_templates:
    very_anxious: I frequently have problems with new medications and feel very worried when my doctor prescribes something new. Before I start treatment, I would like a clear overview of the possible problems.
    anxious: I sometimes have problems with new medications and feel a bit worried when my doctor prescribes something new. Before I start treatment, I would like a clear overview of the possible problems.
    neutral: Before I start a new medication prescribed by my doctor, I would like a clear overview of the possible problems.
    confident: I have never had problems with new medications, so I do not feel worried. Still, before I start a new medication prescribed by my doctor, I would like a clear overview of the possible problems.
- case: drug:pioglitazone_adult_type2_diabetes_adverse_effects_and_contraindications
  case_id: '1'
  type: adverse_effect_and_contraindication_assessment
  input:
    medication_context:
      medicine: pioglitazone
      indication: type 2 diabetes
      paragraph: My doctor prescribed pioglitazone for type 2 diabetes. What are the adverse reactions and contraindications?
  expected:
    answer:
    - ''
    summary: 'A strong answer should clearly separate adverse effects from contraindications and should reflect use in an adult patient with type 2 diabetes. Very common adverse effects include oedema, especially when pioglitazone is combined with insulin, and hypoglycaemia when pioglitazone is used in combination with other antidiabetic medicines. Common adverse effects include heart failure in combination with insulin, bone fractures, respiratory tract infection, visual disturbances, weight gain, hypoaesthesia, headache, somnolence, dizziness, arthralgia, impotence, back pain, dyspnoea, mild reduction in red blood cells, and flatulence. Uncommon adverse effects include bladder cancer, sinusitis, insomnia, glycosuria, protein in urine, increased enzyme values, vertigo, sweating, fatigue, and increased appetite. The answer should also mention the contraindications: hypersensitivity to pioglitazone or excipients, heart failure or a history of heart failure, liver disease, prior diabetic ketoacidosis,
      current or previous bladder cancer, and blood in the urine that has not been investigated. Not known effects such as raised liver enzymes, allergic reactions, male fractures, or macular oedema with blurred vision may be mentioned but are not required for this case.'
    adverse_effects:
      very_common:
      - edema with insulin combination
      - hypoglycemia with combination antidiabetic treatment
      common:
      - arthralgia
      - back pain
      - bone fractures
      - dizziness
      - dyspnea
      - flatulence
      - headache
      - heart failure with insulin combination
      - hypoaesthesia
      - impotence
      - mild reduction in red blood cells
      - respiratory tract infection
      - somnolence
      - visual disturbances
      - weight gain
      uncommon:
      - bladder cancer
      - fatigue
      - glycosuria
      - increased appetite
      - increased enzyme values
      - insomnia
      - protein in urine
      - sinusitis
      - sweating
      - vertigo
    contraindications:
      - current bladder cancer
      - heart failure
      - history of heart failure
      - hypersensitivity to an excipient
      - hypersensitivity to pioglitazone
      - liver disease
      - previous bladder cancer
      - prior diabetic ketoacidosis
      - unexplained blood in the urine
    individual: adult_type2_diabetes_pioglitazone_safety
